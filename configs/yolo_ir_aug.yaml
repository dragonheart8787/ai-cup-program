# IR augmented-data model (fold 0). Identical to configs/yolo_ir.yaml except dataset variant.
modality: IR
variant: aug                 # <work>/IR_aug/fold0 (35% of train images replaced by colorization round trips)
fold: 0
seed: 42
model: yolo11s-seg.pt
imgsz: 640
batch: 16
epochs: 30
smoke_epochs: 2
